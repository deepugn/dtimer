version: "3.8"

services:
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://dtimeruser:dtimerpassword@postgres:5432/dtimerdb?schema=public
      - JWT_SECRET=change-this-to-a-very-secure-random-secret-key-in-production
      - NODE_ENV=production
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: dtimeruser
      POSTGRES_PASSWORD: dtimerpassword
      POSTGRES_DB: dtimerdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
